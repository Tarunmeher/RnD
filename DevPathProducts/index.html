<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Downloads | Developer Suite</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg-light: #f8fafc;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.5;
            padding: 60px 20px;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 60px; }
        header h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 10px; }
        header h1 span { color: var(--primary); }
        header p { color: var(--text-muted); font-size: 1.1rem; }

        #product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--white);
            border: 1px solid #e2e8f0;
            padding: 30px;
            border-radius: 24px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .icon-box {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-header h3 { font-size: 1.25rem; font-weight: 700; }

        .version-tag {
            font-size: 0.75rem;
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 99px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .description {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
            flex-grow: 1;
        }

        .btn-group { display: flex; flex-direction: column; gap: 10px; }

        .btn {
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: #f8fafc;
            border-radius: 12px;
            color: #334155;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .btn:hover {
            background: var(--primary);
            color: white;
        }

        footer { text-align: center; margin-top: 80px; color: #94a3b8; font-size: 0.875rem; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Our <span>Products</span></h1>
            <p>Download the latest versions of our specialized software tools.</p>
        </header>

        <div id="product-grid">
            <!-- Content loaded via JavaScript -->
        </div>

        <footer>
            <p>© 2026 Developer Suite. All rights reserved by DevPath Solution.</p>
        </footer>
    </div>

    <script>
        async function loadProducts() {
            try {
                const response = await fetch('products.json');
                const products = await response.json();
                renderProducts(products);
            } catch (err) {
                console.error('Error loading products:', err);
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(product => `
                <div class="card">
                    <div class="icon-box" style="background-color: ${product.color}">
                        <i class="fa-solid ${product.icon}"></i>
                    </div>
                    <div class="card-header">
                        <h3>${product.name}</h3>
                        <span class="version-tag">v${product.version}</span>
                    </div>
                    <p class="description">${product.description}</p>
                    <div class="btn-group">
                        ${product.downloads.map(dl => `
                            <a href="${dl.url}" class="btn">
                                <span><i class="${dl.icon}"></i> ${dl.platform}</span>
                                <i class="fa-solid fa-arrow-right-long"></i>
                            </a>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        loadProducts();
    </script>
</body>
</html>
