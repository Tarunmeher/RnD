<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geoserver Layer Field Generator</title>
    <style>
        /*Button*/
        .btn-gis-gradient {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2), 0 2px 4px -1px rgba(37, 99, 235, 0.1);
            transition: all 0.2s ease-in-out;
        }

        .btn-gis-gradient:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }

        .btn-gis-gradient:active {
            transform: translateY(0);
        }

        .icon {
            width: 18px;
            height: 18px;
        }



        /*Loader*/
        .loader-container {
            display: none;
            align-items: center;
            gap: 12px;
            font-family: system-ui, -apple-system, sans-serif;
            color: #334155;
            font-size: 14px;
        }

        .spinner-inline {
            width: 20px;
            height: 20px;
            border: 3px solid #e2e8f0;
            border-top-color: #2563eb;
            /* Matches the Blue Theme */
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

ayers\":\"seepz_poc:seepz_other_point\",\"checked\":false,\"options\":{\"format\":\"image/png\",\"version\":\"1.1.0\",\"transparent\":\"true\"},\"dataType\":\"wms\",\"dataGroupId\":\"1\"}],\"name\":\"Layer\",\"title\":\"Layers\",\"bodyId\":\"baselayer_container\",\"checked\":true,\"buttonID\":\"baselayer_btn\"},{\"item\":[{\"id\":\"mesh\",\"lat\":19.12545,\"lng\":72.87685,\"url\":\"/seepz_mesh/3dtiles.json\",\"name\":\"data\",\"title\":\"Seepz Mesh\",\"dataId\":\"101\",\"height\":100,\"dataType\":\"mesh\",\"dataGroupId\":\"2\"}],\"name\":\"Model\",\"title\":\"3D Mesh\",\"bodyId\":\"model_container\",\"checked\":false,\"buttonID\":\"model_btn\"},{\"item\":[{\"id\":\"terrain\",\"url\":\"http://203.112.156.34/seepz_dem\",\"name\":\"Terrain\",\"title\":\"DEM Layer\",\"dataId\":\"1\",\"dataType\":\"terrain\",\"layertype\":\"terrain\",\"dataGroupId\":\"3\"}],\"name\":\"Terrain\",\"title\":\"Terrain\",\"bodyId\":\"terrain_container\",\"checked\":true,\"buttonID\":\"terrain_btn\"}]");
        const total = tocdata && tocdata[0].item.length;
        function takeAction() {
            document.getElementById("loader").style.display = 'inline-flex';
            tocdata[0].item.forEach((element, index) => {
                if (element.dataType == "wms") {
                    const url = `http://203.112.156.34/geoserver/wfs?service=WFS&version=1.1.0&request=DescribeFeatureType&typeName=${element.layers}&outputFormat=application/json`;
                    fetchLayerFields(url, index);
                }
            });
        }

        async function fetchLayerFields(url, index) {
            const res = await fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    return data;
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                });

            if (res) {
                formatLayerData(res, index)
            }
        }

        const layerFieldDetail = [];
        function formatLayerData(geoserverResponse, index) {
            const featureType = geoserverResponse?.featureTypes?.[0];

            if (!featureType) {
                return null;
            }
            const displayName = featureType.typeName;
            const fields = featureType.properties
                .filter(prop => prop.localType !== 'Geometry' && prop.name !== 'geom')
                .map(prop => [{fieldName: prop.name, fieldType:prop.localType}]);

            layerFieldDetail.push({
                "display_name": displayName,
                "layer_name": featureType.typeName,
                "field_name": [...fields].map((field)=> field[0]),
                "outfield": [...fields].map((field)=> field[0].fieldName) // Creates a copy of the fields array
            });
            if (total - 1 == index) {
                downloadJSON(layerFieldDetail);
            }
        }


        function downloadJSON(data, filename = 'geoserver_layers_config.json') {
            const jsonString = JSON.stringify(data, null, 2);

            const blob = new Blob([jsonString], { type: 'application/json' });

            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            URL.revokeObjectURL(link.href);
            document.getElementById("loader").style.display = 'none';
        }
